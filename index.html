<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개발자 포트폴리오</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background-color: #1e1e1e;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: #ffffff;
            margin: 0 1rem;
            text-decoration: none;
        }
        section {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .project {
            background-color: #1e1e1e;
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 5px;
        }
        footer {
            background-color: #1e1e1e;
            text-align: center;
            padding: 1rem;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>안녕하세요, 개발자 [이름]입니다</h1>
        <p>웹 개발자 포트폴리오</p>
    </header>
    <nav>
        <a href="#about">소개</a>
        <a href="#projects">프로젝트</a>
        <a href="#skills">스킬</a>
        <a href="#experience">경험</a>
        <a href="#contact">연락처</a>
    </nav>
    <section id="about">
        <h2>소개</h2>
        <p>저는 열정적인 웹 개발자입니다. [자기소개 내용]</p>
        <img src="profile.jpg" alt="프로필 이미지" style="width: 150px; height: 150px; border-radius: 50%;">
    </section>
    <section id="projects">
        <h2>프로젝트</h2>
        <div class="project">
            <h3>프로젝트 1</h3>
            <p>설명: [프로젝트 설명]</p>
            <img src="project1.jpg" alt="프로젝트 1 이미지" style="width: 200px;">
        </div>
        <div class="project">
            <h3>프로젝트 2</h3>
            <p>설명: [프로젝트 설명]</p>
            <img src="project2.jpg" alt="프로젝트 2 이미지" style="width: 200px;">
        </div>
    </section>
    <section id="skills">
        <h2>스킬</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
        </ul>
    </section>
    <section id="experience">
        <h2>경험</h2>
        <p>[경험 내용]</p>
    </section>
    <section id="contact">
        <h2>연락처</h2>
        <p>Email: example@email.com</p>
        <p>GitHub: <a href="https://github.com/username">username</a></p>
    </section>
    <footer>
        <p>&copy; 2023 [이름]. All rights reserved.</p>
    </footer>
</body>
</html>
